name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Report high and critical advisories, including the transitive
      # dependencies that Dependabot's direct-only allow list does not
      # surface as version-update pull requests. Annotations surface in the
      # run summary but never fail the job, so tests still execute.
      - name: Audit dependencies (warn only)
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning::npm audit found high or critical advisories. CI continues; update the affected dependencies."
          elif [ "$status" -ne 0 ]; then
            echo "::warning::npm audit could not complete (exit code $status). CI continues."
          fi
      # Reuse the package script so CI and local type checking cover the same
      # files: app sources plus vite.config.ts and vitest.config.ts.
      - run: npm run typecheck
      # Reuse the package script so CI and local linting cover the same files.
      - run: npm run lint
      # Run the full production build so config type errors and bundling
      # failures cannot reach main unnoticed.
      - run: npm run build
      - run: npx vitest run
