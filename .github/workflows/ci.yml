name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Fail on high and critical advisories, including the transitive
      # dependencies that Dependabot's direct-only allow list does not
      # surface as version-update pull requests.
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      # Reuse the package script so CI and local linting cover the same files.
      - run: npm run lint
      - run: npx vitest run
